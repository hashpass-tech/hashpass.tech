name: Event source sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run sync:events
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-source-sync
          path: |
            packages/config/src/generated/ingested-events.json
            artifacts/event-ingestion/health.json
          retention-days: 14
